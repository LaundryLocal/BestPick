<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BestPick - Kurasi Produk Shopee Terlaris</title>
    
    <!-- Tailwind & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Plus Jakarta Sans', sans-serif] },
            colors: { shopee: '#EE4D2D' }
          }
        }
      }
    </script>

    <style>
      body { background-color: #ffffff; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
      #loading-screen {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: white; z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 40px; height: 40px; border: 4px solid #f3f3f3;
        border-top: 4px solid #EE4D2D; border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #error-display {
        display: none; position: fixed; inset: 0; background: #fff1f2;
        color: #be123c; padding: 20px; z-index: 10000; overflow: auto; font-family: monospace;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19",
    "react-dom": "https://esm.sh/react-dom@19",
    "react-dom/client": "https://esm.sh/react-dom@19/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <!-- Layar Loading -->
    <div id="loading-screen">
      <div class="spinner"></div>
      <p style="margin-top: 15px; font-weight: 800; color: #1e293b; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;">Menyiapkan Katalog...</p>
    </div>

    <!-- Tampilan Error -->
    <div id="error-display">
      <h2 style="font-weight: bold;">Oops! Aplikasi Gagal Dimuat</h2>
      <p>Detail Error:</p>
      <pre id="error-content"></pre>
      <button onclick="location.reload()" style="margin-top: 20px; padding: 12px 24px; background: #be123c; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">Segarkan Halaman</button>
    </div>

    <div id="root"></div>

    <script>
      // Logging error untuk HP
      window.onerror = function(msg, url, line, col, error) {
        console.error(error);
        const loading = document.getElementById('loading-screen');
        if (loading) loading.style.display = 'none';
        
        const display = document.getElementById('error-display');
        display.style.display = 'block';
        document.getElementById('error-content').textContent = `${msg}\nFile: ${url}\nLine: ${line}`;
        return false;
      };
    </script>

    <!-- Mount React secara langsung -->
    <script type="text/babel" data-type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import App from './App.tsx';

      try {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Sembunyikan loading setelah render
        setTimeout(() => {
          const ls = document.getElementById('loading-screen');
          if (ls) {
            ls.style.opacity = '0';
            setTimeout(() => ls.style.display = 'none', 500);
          }
        }, 800);
      } catch (err) {
        window.onerror(err.message, 'internal', 0, 0, err);
      }
    </script>
  </body>
</html>
