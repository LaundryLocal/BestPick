<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BestPick - Kurasi Produk Shopee Terlaris</title>
    
    <!-- Tailwind & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Babel untuk transpile TSX di Browser (PENTING untuk GitHub Pages No-Build) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
            colors: { shopee: '#EE4D2D' }
          }
        }
      }
    </script>

    <style>
      body { background-color: #ffffff; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
      #loading-screen {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: white; z-index: 9999;
      }
      .spinner {
        width: 40px; height: 40px; border: 4px solid #f3f3f3;
        border-top: 4px solid #EE4D2D; border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #error-display {
        display: none; position: fixed; inset: 0; background: #fff1f2;
        color: #be123c; padding: 20px; z-index: 10000; overflow: auto; font-family: monospace;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19",
    "react-dom": "https://esm.sh/react-dom@19",
    "react-dom/client": "https://esm.sh/react-dom@19/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <!-- Layar Loading -->
    <div id="loading-screen">
      <div class="spinner"></div>
      <p style="margin-top: 15px; font-weight: bold; color: #64748b; font-size: 12px; letter-spacing: 0.1em;">MEMUAT KATALOG...</p>
    </div>

    <!-- Tampilan Error jika gagal -->
    <div id="error-display">
      <h2 style="font-weight: bold;">Aplikasi Gagal Dimuat:</h2>
      <pre id="error-content"></pre>
      <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #be123c; color: white; border: none; border-radius: 8px;">Coba Lagi</button>
    </div>

    <div id="root"></div>

    <script>
      // Tangkap error global untuk debugging di HP
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.getElementById('loading-screen').style.display = 'none';
        const display = document.getElementById('error-display');
        display.style.display = 'block';
        document.getElementById('error-content').textContent = 
          msg + '\nLine: ' + lineNo + '\n' + (error ? error.stack : '');
        return false;
      };
    </script>

    <!-- Load index.tsx menggunakan Babel -->
    <script type="text/babel" data-type="module">
      import "./index.tsx";
      // Sembunyikan loading setelah React siap
      setTimeout(() => {
        const loading = document.getElementById('loading-screen');
        if (loading) loading.style.opacity = '0';
        setTimeout(() => loading && (loading.style.display = 'none'), 500);
      }, 1000);
    </script>
  </body>
</html>
